name: WebKit compile worker smoke

# Runs the compile-worker harness in WebKit, the engine behind Safari. It is not part of the
# deploy gate: Safari keeps the compile worker opt-in until this job passes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Split so a stall shows in the log: the apt packages first, then the WebKit download.
      - name: Install WebKit system dependencies
        run: npx playwright install-deps webkit
        timeout-minutes: 10

      - name: Install WebKit
        run: npx playwright install webkit
        timeout-minutes: 10

      - name: Compile worker in WebKit
        run: node scripts/release-compile-worker-smoke.mjs
        env:
          CLEAR_WRITER_SMOKE_BROWSER: webkit

      - name: Draft hard-kill durability in WebKit
        run: node scripts/webkit-draft-kill-test.mjs
